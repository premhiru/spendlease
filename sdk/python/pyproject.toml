[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spendlease"
version = "0.2.0b2"
description = "Thin Python helpers for the spendlease spend authorization gateway"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "spendlease contributors" }]
keywords = ["ai", "agents", "spend", "budget", "gateway"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/premhiru/spendlease"
Documentation = "https://premhiru.github.io/spendlease/"
Changelog = "https://github.com/premhiru/spendlease/blob/main/CHANGELOG.md"
Issues = "https://github.com/premhiru/spendlease/issues"

[tool.setuptools.packages.find]
where = ["src"]
