name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  preflight:
    name: Validate release intent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Check versions and changelog
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$IS_TAG" == "true" ]]; then
            python scripts/release_preflight.py --tag "$RELEASE_TAG"
          else
            python scripts/release_preflight.py
          fi

      - name: Require a merged main commit
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must point to a commit already merged into main."
            exit 1
          }

      - name: Require confirmed registry publishers
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PYPI_READY: ${{ vars.PYPI_TRUSTED_PUBLISHER_READY }}
          NPM_READY: ${{ vars.NPM_TRUSTED_PUBLISHER_READY }}
        run: |
          failed=false
          if [[ "$PYPI_READY" != "true" ]]; then
            echo "::error::Set PYPI_TRUSTED_PUBLISHER_READY=true only after the pending publisher is configured."
            failed=true
          fi
          if [[ "$NPM_READY" != "true" ]]; then
            echo "::error::Set NPM_TRUSTED_PUBLISHER_READY=true only after @spendlease/sdk has a trusted publisher."
            failed=true
          fi
          [[ "$failed" == "false" ]]

  image:
    name: Publish container image
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      # setup-buildx pulls the buildkit image from Docker Hub, which is
      # unauthenticated and rate limited on GitHub runners. It has already
      # failed once with "context deadline exceeded" and silently left :edge a
      # commit behind. One retry turns a coin flip into a near certainty.
      - name: Set up buildx
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Set up buildx (retry)
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Record the source timestamp
        id: build
        run: echo "date=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` deliberately only moves on a stable tag. A prerelease must
      # never become the image a stranger gets from `docker run ghcr.io/...`
      # with no tag -- see the note in the README quickstart. A hyphen in the
      # tag name is what marks a prerelease: v0.1.0-alpha.1.
      - name: Decide whether latest moves
        id: flavor
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != *-* ]]; then
            echo "value=latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: ${{ steps.flavor.outputs.value }}
          labels: |
            org.opencontainers.image.title=spendlease
            org.opencontainers.image.description=Spend authorization gateway for AI agents

      - name: Build and push
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign and attest the image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image reference
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          printf '%s@%s\n' "${IMAGE}" "${{ steps.publish.outputs.digest }}" > dist/container-image.txt

      - name: Attach immutable image reference to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: dist/container-image.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      # Pull the image we just pushed and exercise its default command. Running
      # only `version` would not catch a non-writable /data volume.
      - name: Verify the published image runs
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run --rm "$tag" version
          container=$(docker run -d -p 127.0.0.1::4000 "$tag")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container" 4000/tcp | awk -F: '{print $NF}')
          for _ in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:${port}/healthz" &&
               curl --fail --silent "http://127.0.0.1:${port}/readyz"; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep -q true; then
              docker logs "$container"
              exit 1
            fi
            sleep 0.5
          done
          docker logs "$container"
          exit 1

  binaries:
    name: Attach binaries to release
    needs: preflight
    # Only tags produce a GitHub release; main pushes just refresh :edge.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        id: build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          name="spendlease_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}${ext}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          build_date=$(git show -s --format=%cI "$GITHUB_SHA")
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7} -X main.date=${build_date}" \
            -o "dist/${name}" ./cmd/spendlease
          (cd dist && sha256sum "${name}" > "${name}.sha256")

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: dist/${{ steps.build.outputs.name }}
          format: spdx-json
          output-file: dist/${{ steps.build.outputs.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ steps.build.outputs.name }}

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ steps.build.outputs.name }}
          sbom-path: dist/${{ steps.build.outputs.name }}.spdx.json

      - name: Include offline verification bundles
        run: |
          cp '${{ steps.provenance.outputs.bundle-path }}' 'dist/${{ steps.build.outputs.name }}.provenance.sigstore.json'
          cp '${{ steps.sbom.outputs.bundle-path }}' 'dist/${{ steps.build.outputs.name }}.sbom.sigstore.json'

      - name: Upload to the release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: dist/*
          # Anything with a hyphen in the version is a prerelease: v0.1.0-alpha.1.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  python-package:
    name: Publish Python package
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install build==1.5.0 twine==7.0.0
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          python -m build sdk/python
          python -m twine check sdk/python/dist/*

      - name: Match package version to release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import pathlib, tomllib, os
          version = tomllib.loads(pathlib.Path("sdk/python/pyproject.toml").read_text())["project"]["version"]
          expected = "v" + version.replace("b", "-beta.")
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag {os.environ['RELEASE_TAG']} does not match Python package {version} ({expected})")
          PY

      - name: Record Python package checksums
        run: |
          mkdir -p dist/python-package
          (cd sdk/python/dist && sha256sum -- *) > dist/python-package/SHA256SUMS

      - name: Attest Python package provenance
        id: python-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: dist/python-package/SHA256SUMS

      - name: Include Python provenance bundle
        run: cp '${{ steps.python-provenance.outputs.bundle-path }}' dist/python-package/python-package.provenance.sigstore.json

      - name: Attach Python distributions to release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: |
            sdk/python/dist/*
            dist/python-package/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdk/python/dist/

  npm-package:
    name: Publish npm package
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Build and pack
        working-directory: sdk/typescript
        run: |
          minimum=11.5.1
          current=$(npm --version)
          if [[ "$(printf '%s\n%s\n' "$minimum" "$current" | sort -V | head -n1)" != "$minimum" ]]; then
            echo "npm $minimum or later is required for trusted publishing; found $current"
            exit 1
          fi
          npm ci
          mkdir -p dist-package
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          npm pack --pack-destination dist-package

      - name: Match package version to release tag
        working-directory: sdk/typescript
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "tag ${RELEASE_TAG} does not match npm package ${version}"
            exit 1
          fi

      - name: Record npm package checksum
        run: (cd sdk/typescript/dist-package && sha256sum -- * > SHA256SUMS)

      - name: Attest npm package provenance
        id: npm-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: sdk/typescript/dist-package/SHA256SUMS

      - name: Include npm provenance bundle
        run: cp '${{ steps.npm-provenance.outputs.bundle-path }}' sdk/typescript/dist-package/npm-package.provenance.sigstore.json

      - name: Attach npm package to release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          files: sdk/typescript/dist-package/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      - name: Publish to npm with provenance
        working-directory: sdk/typescript
        run: npm publish --access public --provenance
