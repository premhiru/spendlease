name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every step that runs a shell uses bash, on Windows too. The default shell
# there is PowerShell, which mangles native arguments like
# "-coverprofile=coverage.out" into two tokens.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Streaming latency budget
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -run TestStreamingGatewayOverheadP99 ./internal/gateway

      # The race detector needs cgo. The shipped binary is still CGO_ENABLED=0;
      # this only affects how tests are compiled.
      - name: Test with race detector
        env:
          CGO_ENABLED: 1
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: spendlease
          POSTGRES_PASSWORD: spendlease
          POSTGRES_DB: spendlease
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spendlease -d spendlease"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Multi-instance storage guarantees
        env:
          CGO_ENABLED: 1
          SPENDLEASE_TEST_POSTGRES_DSN: postgres://spendlease:spendlease@127.0.0.1:5432/spendlease?sslmode=disable
        run: go test -race -count=1 -run TestPostgresMultiInstanceGuarantees ./internal/store/postgres

  build:
    name: Build static binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/spendlease

  sdks:
    name: SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test Python SDK
        env:
          PYTHONPATH: sdk/python/src
        run: python -m unittest discover -s sdk/python/tests

      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci

      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: npm test

      - name: Pack TypeScript SDK
        working-directory: sdk/typescript
        run: npm pack --dry-run

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: spendlease:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image starts, writes its database, and serves health
        run: |
          docker run --rm spendlease:ci version
          container=$(docker run -d -p 127.0.0.1::4000 spendlease:ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$container" 4000/tcp | awk -F: '{print $NF}')
          for attempt in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:${port}/healthz" &&
               curl --fail --silent "http://127.0.0.1:${port}/readyz"; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep -q true; then
              docker logs "$container"
              exit 1
            fi
            sleep 0.5
          done
          docker logs "$container"
          exit 1
