# OpenAI standard synchronous text-token prices checked 2026-07-31.
# Cache writes are reported separately only by the GPT-5.6 family. Long-context
# pricing applies to the whole request once input reaches 272,001 tokens.
version: 2
effective: 2026-07-31
providers:
  openai:
    source: https://developers.openai.com/api/docs/pricing
    models:
      gpt-5.6-sol:
        aliases: [gpt-5.6]
        input_per_1m: 5.00
        cached_input_per_1m: 0.50
        cache_write_5m_per_1m: 6.25
        output_per_1m: 30.00
        long_context_threshold: 272001
        long_input_per_1m: 10.00
        long_cached_input_per_1m: 1.00
        long_cache_write_per_1m: 12.50
        long_output_per_1m: 45.00
        default_max_tokens: 4096
