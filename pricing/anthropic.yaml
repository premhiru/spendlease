# Anthropic Claude API prices, USD per one million tokens.
#
# Base input and output rates only. Prompt caching multipliers (1.25x and 2x
# writes, 0.1x reads) and the Batch API discount are not modelled: those are
# properties of an individual request that spendlease does not yet carry into
# settlement. Base-rate accounting can overstate cache hits and understate
# cache writes, so cached workloads must be compared with the vendor invoice
# before enforcement is enabled.
#
# Claude Sonnet 5 is on introductory pricing through 2026-08-31. The standard
# rate is in anthropic-2026-09-01.yaml, which supersedes this file from that
# date. Old prices are never edited away: past ledger entries have to stay
# explainable.
#
# To update: see CONTRIBUTING.md. Link the vendor pricing page in your PR.

version: 1
effective: 2026-07-01
verified: 2026-08-06

providers:
  anthropic:
    source: https://platform.claude.com/docs/en/about-claude/pricing

    models:
      claude-fable-5:
        input_per_1m: 10.00
        output_per_1m: 50.00
        default_max_tokens: 8192

      claude-mythos-5:
        input_per_1m: 10.00
        output_per_1m: 50.00
        default_max_tokens: 8192
        note: Limited availability under Project Glasswing; priced identically to Fable 5.

      claude-opus-5:
        input_per_1m: 5.00
        output_per_1m: 25.00
        default_max_tokens: 8192

      claude-opus-4-8:
