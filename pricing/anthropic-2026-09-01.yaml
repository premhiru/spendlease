# Claude Sonnet 5 leaves introductory pricing on 2026-09-01.
#
# This file exists to demonstrate the mechanism as much as to carry the price:
# a scheduled change ships as a NEW dated document rather than an edit to
# anthropic.yaml. Until 2026-09-01 the loader ignores this file entirely; from
# that date it supersedes the earlier entry for this model and leaves every
# other model alone.
#
# That is why prices are never edited in place. A ledger entry written in July
# must still be explainable in December, and it can only be explained against
# the price that was in force when it was written.
#
# Source note: "Introductory pricing of $2/$10 per million input/output tokens
# is in effect through August 31, 2026, after which the standard pricing of
# $3/$15 per million input/output tokens will take effect."

version: 1
effective: 2026-09-01

providers:
  anthropic:
    source: https://platform.claude.com/docs/en/about-claude/pricing

    models:
      claude-sonnet-5:
        input_per_1m: 3.00
        output_per_1m: 15.00
        default_max_tokens: 8192
        note: Standard rate, replacing the introductory 2.00/10.00.
