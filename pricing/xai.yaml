# xAI standard text-token prices checked 2026-07-31. Long-context rates apply
# to the whole request at 200,000 prompt tokens.
version: 2
effective: 2026-07-31
providers:
  xai:
    source: https://docs.x.ai/developers/pricing
    models:
      grok-4.5:
        input_per_1m: 2.00
        cached_input_per_1m: 0.30
        output_per_1m: 6.00
        long_context_threshold: 200000
        long_input_per_1m: 4.00
        long_cached_input_per_1m: 0.60
        long_output_per_1m: 12.00
        default_max_tokens: 8192
      grok-build-0.1:
        input_per_1m: 1.00
        cached_input_per_1m: 0.20
        output_per_1m: 2.00
        long_context_threshold: 200000
        long_input_per_1m: 2.00
        long_cached_input_per_1m: 0.40
        long_output_per_1m: 4.00
        default_max_tokens: 8192
      grok-4.3: &grok43
        input_per_1m: 1.25
        cached_input_per_1m: 0.20
        output_per_1m: 2.50
        long_context_threshold: 200000
        long_input_per_1m: 2.50
        long_cached_input_per_1m: 0.40
        long_output_per_1m: 5.00
        default_max_tokens: 8192
      grok-4.20-multi-agent-0309: *grok43
      grok-4.20-0309-reasoning: *grok43
      grok-4.20-0309-non-reasoning: *grok43
